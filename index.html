<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nómina — San Antonio · CONSTRUCTHOR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#1F2D3D;--blue:#185FA5;--lblue:#D6E8F7;--white:#fff;
  --gold:#FFCC00;--green:#3B6D11;--lgreen:#EAF3DE;
  --orange:#BA7517;--red:#A32D2D;--lred:#FCEBEB;
  --yellow:#FFF8E1;--amber:#F0B429;
  --gray1:#F7F7F5;--gray2:#EFEFED;--gray3:#D8D8D5;
  --text1:#1A1A18;--text2:#5F5E5A;--text3:#9B9A96;
  --radius:10px;--radius-sm:6px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--gray1);color:var(--text1);min-height:100vh;font-size:14px}
.screen{display:none}.screen.active{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}

/* TOP BAR */
.top-bar{background:var(--dark);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-brand-name{font-size:13px;font-weight:600;color:var(--white)}
.top-brand-sub{font-size:10px;color:var(--gold);margin-top:1px}
.role-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--white);display:flex;align-items:center;gap:6px}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);border-radius:var(--radius-sm);padding:5px 10px;font-size:11px;cursor:pointer;font-family:var(--font)}
.btn-logout:hover{background:rgba(255,255,255,.08)}

/* LOGIN */
.login-outer{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D1B2A 0%,#1F2D3D 50%,#0D1B2A 100%);padding:2rem;position:relative;overflow:hidden}
.login-logo-name{font-size:26px;font-weight:700;color:#fff;letter-spacing:1px;text-align:center}
.login-logo-sub{font-size:12px;color:var(--gold);margin-top:4px;text-align:center;margin-bottom:2rem;letter-spacing:.5px}
.login-card{background:#fff;border-radius:14px;padding:1.75rem;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;z-index:1}
.login-title{font-size:15px;font-weight:600;color:var(--text1);margin-bottom:4px;text-align:center}
.login-sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:1.25rem}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:1rem 0}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--gray3);transition:background .15s}
.pin-dot.filled{background:var(--blue)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:210px;margin:0 auto}
.pin-key{padding:15px;text-align:center;font-size:18px;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--gray3);cursor:pointer;background:#fff;color:var(--text1);font-family:var(--font);transition:all .1s}
.pin-key:hover{background:var(--gray1)}.pin-key:active{transform:scale(.95)}
.pin-error{color:var(--red);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* CARDS */
.card{background:var(--white);border:1px solid var(--gray3);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;display:flex;align-items:center;gap:6px}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--gray3);margin-bottom:1.5rem;gap:4px}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab:hover{color:var(--text1);background:var(--gray2)}
.tab.activo{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:1.5rem}
.stat-box{background:#fff;border:1px solid var(--gray3);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600;color:var(--text1)}
.stat-val.verde{color:var(--green)}.stat-val.rojo{color:var(--red)}.stat-val.azul{color:var(--blue)}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--gray3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--dark);color:#fff;padding:9px 12px;text-align:left;font-weight:500;white-space:nowrap;font-size:11px}
td{padding:8px 12px;border-bottom:1px solid var(--gray2);color:var(--text1);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray1)}

/* BADGES */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-ok{background:var(--lgreen);color:var(--green)}
.b-pend{background:#FAEEDA;color:#854F0B}
.b-aus{background:var(--lred);color:var(--red)}
.b-warn{background:var(--yellow);color:#856404}

/* FORMS */
.field-group{margin-bottom:12px}
.field-label{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em}
.field-input{width:100%;padding:8px 10px;border:1px solid var(--gray3);border-radius:var(--radius-sm);font-size:13px;background:var(--white);color:var(--text1);font-family:var(--font);transition:border .15s;outline:none}
.field-input:focus{border-color:var(--blue)}
select.field-input{cursor:pointer}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* BTNS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--gray3);background:var(--white);color:var(--text1);font-family:var(--font);transition:all .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-primary:hover{background:#0C447C}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}.btn-success:hover{background:#1E4A08}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%;justify-content:center;padding:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem}

/* ALERT */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:var(--yellow);color:#856404;border:1px solid var(--amber)}
.alert-info{background:var(--lblue);color:var(--blue)}

/* PEND CARD */
.pend-card{background:var(--white);border:1.5px solid var(--amber);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.pend-header{background:var(--yellow);padding:10px 14px;display:flex;align-items:center;gap:10px}
.pend-nombre{font-size:14px;font-weight:700;flex:1}
.pend-body{padding:14px}
.pend-datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pend-dato{font-size:11px;color:var(--text3)}
.pend-dato strong{display:block;font-size:13px;color:var(--text1);font-weight:600}
.estado-chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{flex:1;min-width:140px;padding:8px;border-radius:var(--radius-sm);text-align:center;font-size:11px;font-weight:600}
.chip-pend{background:var(--yellow);color:#856404}
.chip-ok{background:var(--lgreen);color:var(--green)}
.chip-rech{background:var(--lred);color:var(--red)}
.aprov-btns{display:flex;flex-direction:column;gap:6px}
.btn-aprov{width:100%;padding:10px;border-radius:var(--radius-sm);border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
.btn-aprov-obra{background:var(--lgreen);color:var(--green);border:1.5px solid #a7d99a}
.btn-aprov-obra.aprobado{background:var(--green);color:#fff}
.btn-aprov-proy{background:var(--lblue);color:var(--blue);border:1.5px solid #a3c8ef}
.btn-aprov-proy.aprobado{background:var(--blue);color:#fff}
.btn-rechazar{background:var(--lred);color:var(--red);border:1.5px solid #f5b8b8;margin-top:4px}

/* ASISTENCIA */
.trabajador-row{background:var(--white);border:1px solid var(--gray3);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .15s}
.trabajador-row.presente{border-color:#86efac}
.trabajador-row.ausente{border-color:#fca5a5}
.trab-top{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gray2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text3);flex-shrink:0}
.avatar.p{background:var(--lgreen);color:var(--green)}
.avatar.a{background:var(--lred);color:var(--red)}
.trab-info{flex:1;min-width:0}
.trab-nombre{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trab-cargo{font-size:11px;color:var(--text3)}
.toggle{width:50px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}.toggle.on::after{transform:translateX(24px)}
.toggle.off{background:var(--gray3)}
.nov-panel{display:none;background:#fef2f2;border-top:1px solid #fecaca;padding:12px 14px}
.nov-panel.vis{display:block}
.nov-label{font-size:11px;font-weight:600;color:var(--red);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.nov-opts{display:flex;flex-direction:column;gap:6px}
.nov-opt{padding:9px 12px;border-radius:var(--radius-sm);border:1.5px solid #fecaca;background:#fff;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;font-family:var(--font)}
.nov-opt.sel{border-color:var(--red);background:#fef2f2;color:var(--red);font-weight:600}
.nov-obs{width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid #fecaca;border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);resize:none;outline:none;background:#fff}
.contadores{display:flex;gap:8px;margin-bottom:14px}
.cnt{flex:1;background:var(--white);border:1px solid var(--gray3);border-radius:var(--radius);padding:10px;text-align:center;box-shadow:var(--shadow)}
.cnt-num{font-size:20px;font-weight:700}
.cnt-lab{font-size:10px;color:var(--text3);margin-top:2px}

/* ÉXITO */
.overlay-ok{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#064e3b,#065f46);z-index:200;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:2rem}
.overlay-ok.vis{display:flex}
.ok-icon{font-size:64px;margin-bottom:16px}
.ok-title{font-size:24px;font-weight:700;margin-bottom:8px}
.ok-sub{font-size:13px;opacity:.8;line-height:1.5}
.ok-detail{margin-top:20px;background:rgba(255,255,255,.1);border-radius:10px;padding:14px 20px;width:100%;max-width:300px}
.ok-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.ok-row .l{opacity:.7}
.btn-nueva{margin-top:24px;padding:12px 28px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font)}

/* CARGANDO */
.overlay-load{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center}
.overlay-load.vis{display:flex}
.spin-card{background:#fff;border-radius:14px;padding:24px 32px;text-align:center}
.spinner{width:32px;height:32px;border:3px solid var(--gray3);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* SEGURIDAD SOCIAL */
.ss-tabla td{font-size:12px}
.pend-tag{color:var(--red);font-weight:600;font-size:11px}
.ok-tag{color:var(--green);font-weight:500;font-size:11px}

.sep{height:1px;background:var(--gray2);margin:1rem 0}
.muted{font-size:12px;color:var(--text3)}
.mt8{margin-top:8px}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px}

@media(max-width:600px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .pend-datos{grid-template-columns:1fr}
  .top-bar{flex-wrap:wrap;gap:8px}
}
</style>
</head>

function pinKey(k){
  const err = document.getElementById("pinError");
  if(k==="C"){ pinBuffer=pinBuffer.slice(0,-1); }
  else if(pinBuffer.length<4){ pinBuffer+=k; }
  // dots
  for(let i=0;i<4;i++) document.getElementById("d"+i).classList.toggle("filled", i<pinBuffer.length);
  err.textContent="";
  if(pinBuffer.length===4){
    if(ROLES[pinBuffer]){
      rolActual = ROLES[pinBuffer];
      iniciarSesion();
    } else {
      err.textContent="PIN incorrecto. Intente de nuevo.";
      setTimeout(()=>{ pinBuffer=""; for(let i=0;i<4;i++) document.getElementById("d"+i).classList.remove("filled"); },800);
    }
  }
}

function iniciarSesion(){
  document.getElementById("sc-login").classList.remove("active");
  document.getElementById("sc-main").classList.add("active");
  document.getElementById("rolPill").textContent = `${rolActual.icon||"👤"} ${rolActual.nombre} · ${rolActual.rol}`;
  document.getElementById("rolPill").textContent = rolActual.nombre + " · " + rolActual.rol;
  renderTabs();
  irTab(rolActual.tabs[0]);
  initEstadoAsis();
}

function cerrarSesion(){
  rolActual=null; pinBuffer="";
  for(let i=0;i<4;i++) document.getElementById("d"+i).classList.remove("filled");
  document.getElementById("pinError").textContent="";
  document.getElementById("sc-main").classList.remove("active");
  document.getElementById("sc-login").classList.add("active");
}

      <button class="nov-opt${e.novedad===n.id?' sel':''}" onclick="selNov(${p.id},'${n.id}',this)">

        <button class="toggle${esPres?' on':' off'}" onclick="event.stopPropagation();toggleAsis(${p.id})"></button>
      </div>
      <div class="nov-panel${esAus?' vis':''}" id="npanel-${p.id}">
        <div class="nov-label">¿Por qué no está en obra?</div>
        <div class="nov-opts">${opts}</div>
        <textarea class="nov-obs" rows="2" placeholder="Observación opcional..."
          onchange="estadoAsis[${p.id}].obs=this.value">${e.obs||""}</textarea>
      </div>
    </div>`;
  }).join("");

  const urlBanner = !getURL() ? `
    <div class="alert alert-warn">
      ⚙️ <div><strong>Configuración pendiente</strong> — Pegue la URL del Apps Script para activar el envío a Google Sheets.
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="urlInput" type="url" class="field-input" placeholder="https://script.google.com/macros/s/..." style="font-size:11px;font-family:monospace">
        <button class="btn btn-sm btn-primary" onclick="guardarURL()">Guardar</button>
      </div></div>
    </div>` : "";

  return `
  ${urlBanner}
  <div class="contadores">
    <div class="cnt"><div class="cnt-num" style="color:var(--green)">${pres}</div><div class="cnt-lab">Presentes</div></div>
    <div class="cnt"><div class="cnt-num" style="color:var(--red)">${aus}</div><div class="cnt-lab">Ausentes</div></div>
    <div class="cnt"><div class="cnt-num" style="color:var(--blue)">${pend}</div><div class="cnt-lab">Sin marcar</div></div>
  </div>
  <button class="btn btn-success btn-block" onclick="todosPresentes()" style="margin-bottom:12px;font-size:14px">
    ✅ Todos presentes hoy
  </button>
  <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Personal activo en obra</div>

function toggleAsis(id){

  const e=estadoAsis[id];

  if(e.presente) e.novedad=null;

}
function selNov(id,novId,btn){

  localStorage.setItem(LS_URL,v);

async function enviarAsistencia(){
  const activos=getPersonal().filter(p=>p.activo);
  const sinMarcar=activos.filter(p=>!estadoAsis[p.id]||estadoAsis[p.id].presente===null);
  if(sinMarcar.length){alert("Faltan por marcar:\n"+sinMarcar.map(p=>p.nombre).join("\n"));return;}
  const sinNov=activos.filter(p=>estadoAsis[p.id].presente===false&&!estadoAsis[p.id].novedad);
  if(sinNov.length){alert("Seleccione el tipo de ausencia para:\n"+sinNov.map(p=>p.nombre).join("\n"));return;}
  const fecha=getFechaISO();
  const pres=activos.filter(p=>estadoAsis[p.id].presente).length;
  const aus=activos.length-pres;
  const filas=activos.map(p=>({
    fecha,nombre:p.nombre,cargo:p.cargo,
    estado:estadoAsis[p.id].presente?"Presente":"Ausente",
    novedad:estadoAsis[p.id].novedad?NOVEDADES_TIPOS.find(n=>n.id===estadoAsis[p.id].novedad)?.label||"":"",
    observacion:estadoAsis[p.id].obs||"",
    hora:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),
    registradoPor:"Yenny P. Vargas (SST)"
  }));
  const url=getURL();
  if(url){
    document.getElementById("overlayLoad").classList.add("vis");
    try{ await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({accion:"asistencia",registros:filas})}); }
    catch(e){}
    document.getElementById("overlayLoad").classList.remove("vis");
  }
  // Procesar retiros
  const retiros=filas.filter(f=>{
    const tipo=NOVEDADES_TIPOS.find(n=>n.label===f.novedad);
    return tipo?.retiro;
  });
  if(retiros.length>0){
    const personal=getPersonal();
    const histRetiros=getRetiros();
    retiros.forEach(f=>{
      const idx=personal.findIndex(p=>p.nombre===f.nombre);
      if(idx>=0){
        histRetiros.push({
          nombre:personal[idx].nombre,
          cargo:personal[idx].cargo,
          salario:personal[idx].salario,
          motivo:f.novedad,
          fecha:f.fecha,
          observacion:f.observacion||"—",
          registradoPor:f.registradoPor
        });
        personal[idx].activo=false;
        delete estadoAsis[personal[idx].id];
      }
    });
    setPersonal(personal);
    setRetiros(histRetiros);
  }
  // Guardar en historial de asistencia
  const hist=getAsistenciaHist();
  // Remover si ya existe registro del mismo día (para permitir corrección)
  const idx=hist.findIndex(h=>h.fecha===fecha);
  const registro={
    fecha, filas,
    registradoPor: rolActual.nombre+" (SST)",
    registradoEn: new Date().toLocaleString("es-CO"),
    correcciones:[]
  };
  if(idx>=0) hist[idx]=registro;
  else hist.push(registro);
  setAsistenciaHist(hist);

  mostrarOk("¡Asistencia registrada!","Los datos fueron enviados a Google Sheets.",
    `<div class="ok-row"><span class="l">Fecha</span><span>${fecha}</span></div>
     <div class="ok-row"><span class="l">Presentes</span><span>${pres} personas</span></div>
     <div class="ok-row"><span class="l">Ausentes</span><span>${aus} personas</span></div>
     <div class="ok-row"><span class="l">Registrado por</span><span>SST</span></div>`);
  activos.forEach(p=>{ estadoAsis[p.id]={presente:null,novedad:null,obs:""}; });
}

function renderCorreccionAsis(){
  const hist=getAsistenciaHist();
  if(hist.length===0) return `<div class="empty">📋 No hay registros de asistencia aún.</div>`;

  return `
  <div class="card">
    <div class="card-title">✏️ Historial y corrección de asistencia</div>
    <div class="alert alert-warn">Seleccione un día para ver o corregir el registro. Toda corrección queda con log de quién la hizo y cuándo.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Presentes</th><th>Ausentes</th><th>Registrado por</th><th>Correcciones</th><th></th></tr></thead>
        <tbody>${hist.slice().reverse().map(r=>`
          <tr>
            <td><strong>${r.fecha}</strong></td>
            <td style="text-align:center;color:var(--green)">${r.filas.filter(f=>f.estado==="Presente").length}</td>
            <td style="text-align:center;color:var(--red)">${r.filas.filter(f=>f.estado==="Ausente").length}</td>
            <td class="muted" style="font-size:11px">${r.registradoPor}<br>${r.registradoEn}</td>
            <td style="text-align:center">${r.correcciones?.length||0}</td>
            <td><button class="btn btn-sm" onclick="abrirCorreccion('${r.fecha}')">✏️ Editar</button></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function abrirCorreccion(fecha){
  const hist=getAsistenciaHist();
  const reg=hist.find(h=>h.fecha===fecha);
  if(!reg){alert("Registro no encontrado.");return;}

  const filas=reg.filas.map(f=>{
    const novOpts=NOVEDADES_TIPOS.filter(n=>!n.retiro).map(n=>
      `<option value="${n.label}" ${f.novedad===n.label?"selected":""}>${n.label}</option>`).join("");
    return `
    <tr id="fila-cor-${f.nombre.replace(/\s/g,'_')}">
      <td style="font-size:12px"><strong>${f.nombre}</strong><br><span class="muted">${f.cargo}</span></td>
      <td>
        <select style="font-size:12px;padding:4px 6px;border:1px solid var(--gray3);border-radius:4px;font-family:var(--font)"
          onchange="corEstado('${f.nombre.replace(/'/g,"\\'")}',this.value)">
          <option value="Presente" ${f.estado==="Presente"?"selected":""}>✅ Presente</option>
          <option value="Ausente"  ${f.estado==="Ausente" ?"selected":""}>❌ Ausente</option>
        </select>
      </td>
      <td>
        <select style="font-size:12px;padding:4px 6px;border:1px solid var(--gray3);border-radius:4px;font-family:var(--font)"
          onchange="corNovedad('${f.nombre.replace(/'/g,"\\'")}',this.value)">
          <option value="">— Sin novedad —</option>${novOpts}
        </select>
      </td>
    </tr>`;
  }).join("");

  document.getElementById("mainContent").innerHTML=`
  <div class="card">
    <div class="card-title">✏️ Corrección asistencia — ${fecha}</div>
    <div class="alert alert-warn">⚠️ Está editando un registro existente. La corrección quedará registrada con su nombre y la fecha/hora actual.</div>
    <div class="table-wrap" style="margin-bottom:12px">
      <table id="tabla-correccion">
        <thead><tr><th>Trabajador</th><th>Estado</th><th>Novedad</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
    <div class="field-group">
      <label class="field-label">Motivo de la corrección</label>
      <input class="field-input" id="cor-motivo" placeholder="Ej: Error en marcación de Jesús Rodríguez">
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="guardarCorreccion('${fecha}')">💾 Guardar corrección</button>
      <button class="btn" onclick="irTab('asistencia')">Cancelar</button>
    </div>
  </div>`;

  // Guardar estado temporal de corrección
  window._corBuffer = JSON.parse(JSON.stringify(reg.filas));
}

function corEstado(nombre,val){
  const f=window._corBuffer.find(x=>x.nombre===nombre);
  if(f){ f.estado=val; if(val==="Presente") f.novedad=""; }
}
function corNovedad(nombre,val){
  const f=window._corBuffer.find(x=>x.nombre===nombre);
  if(f) f.novedad=val;
}

function guardarCorreccion(fecha){
  const motivo=document.getElementById("cor-motivo")?.value?.trim();
  if(!motivo){alert("Indique el motivo de la corrección.");return;}
  const hist=getAsistenciaHist();
  const idx=hist.findIndex(h=>h.fecha===fecha);
  if(idx<0){alert("Registro no encontrado.");return;}
  if(!hist[idx].correcciones) hist[idx].correcciones=[];
  hist[idx].correcciones.push({
    por:rolActual.nombre+" ("+rolActual.rol+")",
    en:new Date().toLocaleString("es-CO"),
    motivo,
    antes:hist[idx].filas
  });
  hist[idx].filas=JSON.parse(JSON.stringify(window._corBuffer));
  setAsistenciaHist(hist);
  mostrarOk("✅ Corrección guardada",`El registro del ${fecha} fue actualizado.`,
    `<div class="ok-row"><span class="l">Motivo</span><span>${motivo}</span></div>
     <div class="ok-row"><span class="l">Corregido por</span><span>${rolActual.nombre}</span></div>`);
}

function aprobarObra(id){
  const pend=getPendientes();
  const emp=pend.find(p=>p.id===id);
  if(!emp)return;
  emp.aprobadoObra=true;
  setPendientes(pend);
  verificarActivacion(id);
  irTab("vinculacion");
}
function aprobarProy(id){
  const pend=getPendientes();
  const emp=pend.find(p=>p.id===id);
  if(!emp)return;
  emp.aprobadoProy=true;
  setPendientes(pend);
  verificarActivacion(id);
  irTab("vinculacion");
}
function rechazar(id){
  if(!confirm("¿Rechazar esta solicitud?"))return;
  setPendientes(getPendientes().filter(p=>p.id!==id));
  irTab("vinculacion");
}
function verificarActivacion(id){
  const pend=getPendientes();
  const emp=pend.find(p=>p.id===id);
  if(!emp||!emp.aprobadoObra||!emp.aprobadoProy)return;
  const personal=getPersonal();
  personal.push({id:Date.now(),nombre:emp.nombre,cargo:emp.cargo,cedula:emp.cedula,
    salario:emp.salario,fechaIngreso:emp.fechaIngreso,
    eps:"—",pension:"—",arl:"Positiva",ccf:"Comfaboy",activo:true});
  setPersonal(personal);
  setPendientes(pend.filter(p=>p.id!==id));
  estadoAsis[emp.id]={presente:null,novedad:null,obs:""};
  alert(`🎉 ${emp.nombre} activado en el sistema de nómina.`);
}

// Convierte "HH:MM" a número decimal (ej: "14:30" → 14.5)
function horaADecimal(str){
  if(!str) return 0;
  const [h,m]=str.split(":").map(Number);
  return h+(m||0)/60;
}

// Calcula recargo según tipo de día y hora
function calcularRecargo(tipo, horaInicio, horaFin){
  // tipo: "semana" | "sabado" | "domingo"
  const hrs = horaFin - horaInicio;
  if(hrs<=0) return {horas:0, pct:0, tipo_recargo:""};

  let pct=0, tipo_recargo="", horasExtra=hrs;

  if(tipo==="semana"){
    // Extra diurna: 4:00 PM - 9 PM → 25% | Extra nocturna: después 9 PM → 75%
    const corte=21;
    if(horaInicio>=corte){ pct=0.75; tipo_recargo="Extra nocturna (75%)"; }
    else if(horaFin<=corte){ pct=0.25; tipo_recargo="Extra diurna (25%)"; }
    else{
      const hDiurna=corte-horaInicio;
      const hNoct=horaFin-corte;
      pct=(hDiurna*0.25+hNoct*0.75)/hrs;
      tipo_recargo="Extra mixta (diurna+nocturna)";
    }
  } else if(tipo==="sabado"){
    // Jornada normal sábado: 7:30 AM - 12:00 M
    // Solo es extra lo que supere las 12:00 M
    const finNormal=HORA_FIN_SABADO; // 11.5
    const inicioExtra=Math.max(horaInicio, finNormal);
    horasExtra=horaFin-inicioExtra;
    if(horasExtra<=0) return {horas:0, pct:0, tipo_recargo:"Dentro de jornada normal sábado (7:30-12:00)"};
    pct=0.75; tipo_recargo="Extra sábado (75%)";
  } else if(tipo==="domingo"){
    const corte=21;
    if(horaFin<=corte){ pct=0.75; tipo_recargo="Dominical diurno (75%)"; }
    else { pct=1.10; tipo_recargo="Dominical nocturno (110%)"; }
  }
  return {horas:Math.round(horasExtra*100)/100, pct, tipo_recargo};
}

function calcularValorHE(salario, horas, pct){
  const valorHora = salario/240; // 30 días x 8 horas
  return Math.round(valorHora*(1+pct)*horas);
}

  // Botón confirmar revisión (directores)

  if(esDir){

  // Botones SST
  const btnSST=esSST?
    '<button class="btn-aprov" style="background:var(--lblue);color:var(--blue);border:1.5px solid #93c5fd;margin-top:6px" onclick="heEditar('+reg.id+')">✏️ Editar y reenviar</button>'+

  return '<div class="pend-card">'+

    '<span class="pend-nombre">'+reg.fecha+' · '+tipoLabel+'</span></div>'+
    '<div class="pend-body">'+alertaRechazo+
    '<div class="pend-datos">'+
    '<div class="pend-dato"><strong>'+reg.detalle.length+' trabajadores</strong>Con horas extras</div>'+
    '<div class="pend-dato"><strong>'+totalHrs+' horas</strong>Total horas</div>'+
    '<div class="pend-dato"><strong>$'+totalVal.toLocaleString("es-CO")+'</strong>Valor estimado</div>'+
    '<div class="pend-dato"><strong>'+reg.registradoPor+'</strong>Registrado por</div></div>'+
    '<div style="margin-bottom:10px;overflow-x:auto"><table style="width:100%;font-size:11px;border-collapse:collapse">'+
    '<thead><tr style="background:#f1f5f9">'+
    '<th style="padding:4px 8px;text-align:left">Trabajador</th>'+

    colDir+'</tr></thead>'+

function renderHorasExtras(){
  const esSSTouDir=["SST","Director de Obra","Director de Proyecto"].includes(rolActual.rol);
  const esAprobador=["Director de Obra","Director de Proyecto"].includes(rolActual.rol);
  const esFinanzas=["Finanzas","CONSTRUCTHOR"].includes(rolActual.rol);

  const pendientes=getHorasExtras().filter(h=>h.estado==="pendiente");
  const aprobadas=getHorasExtras().filter(h=>h.estado==="aprobado");

  // Formulario de registro (SST)
  const formRegistro = rolActual.rol==="SST" ? `
  <div class="card">
    <div class="card-title">⏱️ Registrar horas extras</div>
    <div class="grid-2">
      <div class="field-group">
        <label class="field-label">Fecha</label>
        <input class="field-input" type="date" id="he-fecha" onchange="heActualizarFecha(this.value)">
      </div>
      <div class="field-group">
        <label class="field-label">Tipo de jornada</label>
        <select class="field-input" id="he-tipo" onchange="heActualizarTipo(this.value)">
          <option value="semana">Entre semana (extra)</option>
          <option value="sabado">Sábado</option>
          <option value="domingo">Domingo / Festivo</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field-group">
        <label class="field-label">⏰ Hora inicio (para todos)</label>
        <input class="field-input" type="time" id="he-hora-inicio" value="16:00"
          onchange="heActualizarHoraGlobal('inicio',this.value)">
      </div>
      <div class="field-group">
        <label class="field-label">⏰ Hora fin (para todos)</label>
        <input class="field-input" type="time" id="he-hora-fin"
          onchange="heActualizarHoraGlobal('fin',this.value)">
      </div>
    </div>

    <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 8px">
      Personal — desmarque quienes NO trabajaron / ajuste hora individual si llegaron diferente
    </div>
    <div id="he-lista-trab"></div>
    <button class="btn btn-primary btn-block mt8" onclick="heEnviar()">📤 Enviar para aprobación de directores</button>
  </div>` : "";

  // Pendientes de aprobación
  const btnSemana = esAprobador && pendientes.length>0 ? `
  <div class="card" style="border:1.5px solid var(--amber);background:var(--yellow)">
    <div class="card-title" style="color:#856404">📅 Aprobación semanal — ${pendientes.length} registro(s) pendiente(s)</div>
    <p style="font-size:12px;color:#92400e;margin-bottom:12px">Apruebe todos los registros de la semana de una sola vez. Recomendado los <strong>lunes</strong>.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${rolActual.rol==="Director de Obra"?`<button class="btn btn-success" onclick="heAprobarSemanaObra()">👷 Aprobar semana completa — Raúl Echeverri</button>`:""}
      ${rolActual.rol==="Director de Proyecto"?`<button class="btn btn-primary" onclick="heAprobarSemanaProy()">💼 Aprobar semana completa — Andrés Chaves</button>`:""}
    </div>
  </div>` : "";

  const pendCard = pendientes.length>0 && (esAprobador||esSSTouDir) ?
    btnSemana +
    '<div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">⏳ Pendientes de aprobación ('+pendientes.length+')</div>' +
    pendientes.concat(getHorasExtras().filter(h=>h.estado==="rechazado_parcial")).map(reg=>heRenderCard(reg)).join("")
    : "";

  // Historial aprobadas
  const historial = aprobadas.length>0 ? `
  <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px">
    ✅ Horas extras aprobadas (${aprobadas.length} registros)
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Trabajadores</th><th>Total horas</th><th>Valor total</th><th>Estado</th></tr></thead>
      <tbody>${aprobadas.map(reg=>{
        const tipoLabel=reg.tipo==="semana"?"Entre semana":reg.tipo==="sabado"?"Sábado":"Dom/Festivo";
        const totalHrs=reg.detalle.reduce((s,d)=>s+d.horas,0).toFixed(1);
        const totalVal=reg.detalle.reduce((s,d)=>s+d.valor,0);
        return `<tr>
          <td>${reg.fecha}</td><td>${tipoLabel}</td>
          <td style="text-align:center">${reg.detalle.length}</td>
          <td style="text-align:center">${totalHrs}h</td>
          <td style="text-align:right;font-weight:600">$${totalVal.toLocaleString("es-CO")}</td>

  setTimeout(()=>heRenderLista(), 50);

function heRenderLista(){
  const cont=document.getElementById("he-lista-trab");
  if(!cont) return;
  const activos=getPersonal().filter(p=>p.activo);
  const horaIni=document.getElementById("he-hora-inicio")?.value||"16:00";
  const horaFin=document.getElementById("he-hora-fin")?.value||"";
  cont.innerHTML=activos.map(p=>{
    const est=heEstado.trabajadores[p.id]||{incluido:true, horaInicio:horaIni, horaFin};
    const hIni=est.horaInicio||horaIni;
    const hFin=est.horaFin||horaFin;
    let preview="";
    if(hIni&&hFin){
      const tipo=document.getElementById("he-tipo")?.value||"semana";
      const r=calcularRecargo(tipo,horaADecimal(hIni),horaADecimal(hFin));
      if(r.horas>0){
        const val=calcularValorHE(p.salario,r.horas,r.pct);
        preview=`<span style="font-size:10px;color:var(--green);margin-left:8px">${r.horas}h · $${val.toLocaleString("es-CO")}</span>`;
      }
    }
    return `
    <div style="background:#fff;border:1px solid var(--gray3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;${est.incluido?'':'opacity:.45'}">
      <input type="checkbox" ${est.incluido?"checked":""} style="width:16px;height:16px;cursor:pointer;accent-color:var(--green)"
        onchange="heToggleTrab(${p.id},this.checked)">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${p.nombre}${preview}</div>
        <div style="font-size:11px;color:var(--text3)">${p.cargo}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="time" value="${hIni}" style="font-size:11px;padding:4px 6px;border:1px solid var(--gray3);border-radius:4px;font-family:var(--font)"
          onchange="heCambiarHoraInd(${p.id},'inicio',this.value)" ${est.incluido?"":"disabled"}>
        <span style="font-size:11px;color:var(--text3)">→</span>
        <input type="time" value="${hFin}" style="font-size:11px;padding:4px 6px;border:1px solid var(--gray3);border-radius:4px;font-family:var(--font)"
          onchange="heCambiarHoraInd(${p.id},'fin',this.value)" ${est.incluido?"":"disabled"}>
      </div>
    </div>`;
  }).join("");
}

function heActualizarFecha(v){ heEstado.fecha=v; }
function heActualizarTipo(v){
  heEstado.tipo=v;
  const inputIni=document.getElementById("he-hora-inicio");
  const inputFin=document.getElementById("he-hora-fin");
  if(v==="semana"){
    if(inputIni) inputIni.value="16:00";
    if(inputFin) inputFin.value="17:00";
  } else if(v==="sabado"){
    if(inputIni) inputIni.value="12:00";
    if(inputFin) inputFin.value="13:00";
  } else { // domingo
    if(inputIni) inputIni.value="07:30";
    if(inputFin) inputFin.value="15:30";
  }
  // Propagar horas al estado global
  if(inputIni) heEstado.horaInicio=inputIni.value;
  if(inputFin) heEstado.horaFin=inputFin.value;
  heRenderLista();
}
function heActualizarHoraGlobal(campo,v){
  if(campo==="inicio") heEstado.horaInicio=v;
  else heEstado.horaFin=v;
  // Propagar a todos los trabajadores que no tienen hora individual personalizada
  getPersonal().filter(p=>p.activo).forEach(p=>{
    if(!heEstado.trabajadores[p.id]) heEstado.trabajadores[p.id]={incluido:false,horaInicio:"",horaFin:""};
    if(campo==="inicio") heEstado.trabajadores[p.id].horaInicio=v;
    else heEstado.trabajadores[p.id].horaFin=v;
  });
  heRenderLista();
}
function heToggleTrab(id,val){
  // Leer horas globales directamente del DOM para no depender del estado
  const horaIni = document.getElementById("he-hora-inicio")?.value || heEstado.horaInicio || "";
  const horaFin = document.getElementById("he-hora-fin")?.value || heEstado.horaFin || "";
  if(!heEstado.trabajadores[id]) heEstado.trabajadores[id]={incluido:val, horaInicio:horaIni, horaFin};
  heEstado.trabajadores[id].incluido=val;
  // Si se está marcando, asegurar que tenga las horas globales
  if(val){
    if(!heEstado.trabajadores[id].horaInicio) heEstado.trabajadores[id].horaInicio=horaIni;
    if(!heEstado.trabajadores[id].horaFin)    heEstado.trabajadores[id].horaFin=horaFin;
  }
  heRenderLista();
}
function heCambiarHoraInd(id,campo,v){
  if(!heEstado.trabajadores[id]) heEstado.trabajadores[id]={incluido:true,horaInicio:heEstado.horaInicio,horaFin:heEstado.horaFin};
  if(campo==="inicio") heEstado.trabajadores[id].horaInicio=v;
  else heEstado.trabajadores[id].horaFin=v;
  heRenderLista();
}

function heEnviar(){
  if(!heEstado.fecha){alert("Seleccione la fecha.");return;}
  const tipo=document.getElementById("he-tipo")?.value||"semana";
  const activos=getPersonal().filter(p=>p.activo);
  const detalle=[];
  for(const p of activos){
    const est=heEstado.trabajadores[p.id];
    if(!est||!est.incluido) continue;
    if(!est.horaInicio||!est.horaFin){alert(`Falta hora de inicio o fin para ${p.nombre}`);return;}
    const r=calcularRecargo(tipo,horaADecimal(est.horaInicio),horaADecimal(est.horaFin));
    if(r.horas<=0){alert(`Las horas de ${p.nombre} no generan tiempo extra válido.`);return;}
    const valor=calcularValorHE(p.salario,r.horas,r.pct);
    detalle.push({
      id:p.id, nombre:p.nombre, cargo:p.cargo, salario:p.salario,
      horaInicio:est.horaInicio, horaFin:est.horaFin,
      horas:r.horas, tipo_recargo:r.tipo_recargo, pct:r.pct, valor
    });
  }
  if(detalle.length===0){alert("No hay trabajadores con horas extras para registrar.");return;}
  const todos=getHorasExtras();
  todos.push({
    id:Date.now(), fecha:heEstado.fecha, tipo,
    detalle, registradoPor:rolActual.nombre+" (SST)",
    aprobadoObra:false, aprobadoProy:false, estado:"pendiente"
  });
  setHorasExtras(todos);
  // Resetear estado
  heEstado={fecha:"",tipo:"semana",horaInicio:"",horaFin:"",trabajadores:{}};
  const totalVal=detalle.reduce((s,d)=>s+d.valor,0);
  const fechaReg=todos[todos.length-1].fecha;
  mostrarOk("¡Horas extras enviadas!",
    "Raúl Echeverri y Andrés Chaves deben aprobar el registro.",
    '<div class="ok-row"><span class="l">Fecha</span><span>'+fechaReg+'</span></div>'+
    '<div class="ok-row"><span class="l">Trabajadores</span><span>'+detalle.length+'</span></div>'+
    '<div class="ok-row"><span class="l">Valor estimado</span><span>$'+totalVal.toLocaleString("es-CO")+'</span></div>');
}

// Aprobación individual
// Marcar aprobación/rechazo por trabajador individual
function heRevision(id, nombre, aprobado){
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  if(!reg.revisionObra) reg.revisionObra={};
  if(!reg.revisionProy) reg.revisionProy={};
  const campo = rolActual.rol==="Director de Obra"?"revisionObra":"revisionProy";
  if(!reg[campo][nombre]) reg[campo][nombre]={estado:'pendiente',comentario:''};
  reg[campo][nombre].estado = aprobado?'aprobado':'rechazado';
  setHorasExtras(todos);
}

// Guardar comentario por trabajador individual
function heComentario(id, nombre, comentario){
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  if(!reg.revisionObra) reg.revisionObra={};
  if(!reg.revisionProy) reg.revisionProy={};
  const campo = rolActual.rol==="Director de Obra"?"revisionObra":"revisionProy";
  if(!reg[campo][nombre]) reg[campo][nombre]={estado:'pendiente',comentario:''};
  reg[campo][nombre].comentario = comentario;
  setHorasExtras(todos);
}

// Confirmar revisión completa del director
function heConfirmarRevision(id){
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  if(!reg.revisionObra) reg.revisionObra={};
  if(!reg.revisionProy) reg.revisionProy={};
  const esObra = rolActual.rol==="Director de Obra";
  const campo  = esObra?"revisionObra":"revisionProy";
  const rev    = reg[campo];

  // Verificar que todos estén revisados
  const sinRevisar = reg.detalle.filter(d=>!rev[d.nombre]||rev[d.nombre].estado==='pendiente');
  if(sinRevisar.length>0){
    if(!confirm("Hay "+sinRevisar.length+" trabajador(es) sin marcar. ¿Desea aprobarlos todos por defecto?")){return;}
    sinRevisar.forEach(d=>{
      if(!rev[d.nombre]) rev[d.nombre]={estado:'aprobado',comentario:''};
      else rev[d.nombre].estado='aprobado';
    });
  }

  // Determinar estado general según revisiones
  const hayRechazo = reg.detalle.some(d=>rev[d.nombre]?.estado==='rechazado');
  if(esObra){
    reg.aprobadoObra  = !hayRechazo;
    reg.rechazadoObra = hayRechazo;
  } else {
    reg.aprobadoProy  = !hayRechazo;
    reg.rechazadoProy = hayRechazo;
  }

  // Si ambos directores revisaron, actualizar estado general
  const obraDone  = reg.aprobadoObra||reg.rechazadoObra;
  const proyDone  = reg.aprobadoProy||reg.rechazadoProy;
  if(obraDone && proyDone){
    if(reg.aprobadoObra && reg.aprobadoProy) reg.estado='aprobado';
    else reg.estado='rechazado_parcial';
  }

  setHorasExtras(todos);
  const aprobados=reg.detalle.filter(d=>rev[d.nombre]?.estado==='aprobado').length;
  const rechazados=reg.detalle.filter(d=>rev[d.nombre]?.estado==='rechazado').length;
  mostrarOk("✅ Revisión confirmada",
    "Su revisión quedó registrada para el "+reg.fecha+".",
    '<div class="ok-row"><span class="l">Aprobados</span><span>'+aprobados+' trabajadores</span></div>'+
    '<div class="ok-row"><span class="l">Con observaciones</span><span>'+rechazados+' trabajadores</span></div>'+
    '<div class="ok-row"><span class="l">Revisado por</span><span>'+rolActual.rol+'</span></div>');
}

function heAprobarObra(id){
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  reg.aprobadoObra=true;
  reg.rechazadoObra=false;
  reg.motivoRechazoObra="";
  if(reg.aprobadoObra&&reg.aprobadoProy) reg.estado="aprobado";
  setHorasExtras(todos);
  irTab("horas_extras");
}
function heAprobarProy(id){
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  reg.aprobadoProy=true;
  reg.rechazadoProy=false;
  reg.motivoRechazoProy="";
  if(reg.aprobadoObra&&reg.aprobadoProy) reg.estado="aprobado";
  setHorasExtras(todos);
  irTab("horas_extras");
}

// Rechazo con motivo
function heRechazarObra(id){
  const motivo=prompt("Motivo del rechazo (Raúl Echeverri):");
  if(motivo===null) return;
  if(!motivo.trim()){alert("Debe escribir un motivo.");return;}
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  reg.aprobadoObra=false;
  reg.rechazadoObra=true;
  reg.motivoRechazoObra=motivo.trim();
  reg.estado="rechazado_parcial";
  setHorasExtras(todos);
  irTab("horas_extras");
}
function heRechazarProy(id){
  const motivo=prompt("Motivo del rechazo (Andrés Chaves):");
  if(motivo===null) return;
  if(!motivo.trim()){alert("Debe escribir un motivo.");return;}
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg) return;
  reg.aprobadoProy=false;
  reg.rechazadoProy=true;
  reg.motivoRechazoProy=motivo.trim();
  reg.estado="rechazado_parcial";
  setHorasExtras(todos);
  irTab("horas_extras");
}

// Aprobación semanal — aprueba TODOS los pendientes de una vez
function heAprobarSemanaObra(){
  if(!confirm("¿Aprobar todos los registros pendientes de la semana como Raúl Echeverri?")) return;
  const todos=getHorasExtras();
  todos.filter(h=>h.estado==="pendiente"||h.estado==="rechazado_parcial").forEach(h=>{
    h.aprobadoObra=true;
    h.rechazadoObra=false;
    h.motivoRechazoObra="";
    if(h.aprobadoObra&&h.aprobadoProy) h.estado="aprobado";
    else h.estado="pendiente";
  });
  setHorasExtras(todos);
  irTab("horas_extras");
}
function heAprobarSemanaProy(){
  if(!confirm("¿Aprobar todos los registros pendientes de la semana como Andrés Chaves?")) return;
  const todos=getHorasExtras();
  todos.filter(h=>h.estado==="pendiente"||h.estado==="rechazado_parcial").forEach(h=>{
    h.aprobadoProy=true;
    h.rechazadoProy=false;
    h.motivoRechazoProy="";
    if(h.aprobadoObra&&h.aprobadoProy) h.estado="aprobado";
    else h.estado="pendiente";
  });
  setHorasExtras(todos);
  irTab("horas_extras");
}

function heRechazar(id){
  if(!confirm("¿Eliminar completamente este registro?")) return;
  setHorasExtras(getHorasExtras().filter(h=>h.id!==id));
  irTab("horas_extras");
}

// Corrección HE — SST corrige un registro rechazado o pendiente
function heEditar(id){
  const todos=getHorasExtras();
  const reg=todos.find(h=>h.id===id);
  if(!reg){alert("Registro no encontrado.");return;}
  if(reg.estado==="aprobado"){alert("No se puede editar un registro ya aprobado.");return;}
  if(!confirm("¿Eliminar este registro para corregirlo y reenviarlo?")) return;
  setHorasExtras(todos.filter(h=>h.id!==id));
  heEstado.fecha=reg.fecha;
  heEstado.tipo=reg.tipo;
  reg.detalle.forEach(d=>{
    heEstado.trabajadores[d.id]={incluido:true,horaInicio:d.horaInicio,horaFin:d.horaFin};
  });
  irTab("horas_extras");
}

// NÓMINA — Liquidación integrada
// ══════════════════════════════════════════════════
function renderNomina(){
  const personal=getPersonal().filter(p=>p.activo);
  const hist=getAsistenciaHist();
  const heAprobadas=getHorasExtras().filter(h=>h.estado==="aprobado");
  const SMMLV=1423500, AUX_T=249095;

  // Calcular días por trabajador desde historial
  const diasMap={};
  personal.forEach(p=>{ diasMap[p.nombre]={presentes:0,ausentes:0,novedades:[]}; });
  hist.forEach(reg=>{
    reg.filas.forEach(f=>{
      if(!diasMap[f.nombre]) return;
      if(f.estado==="Presente") diasMap[f.nombre].presentes++;
      else {
        diasMap[f.nombre].ausentes++;
        if(f.novedad) diasMap[f.nombre].novedades.push(f.novedad);
      }
    });
  });

  // Calcular HE por trabajador
  const heMap={};
  heAprobadas.forEach(reg=>{
    reg.detalle.forEach(d=>{
      if(!heMap[d.nombre]) heMap[d.nombre]={horas:0,valor:0};
      heMap[d.nombre].horas+=d.horas;
      heMap[d.nombre].valor+=d.valor;
    });
  });

  const sinRegistros=hist.length===0;

  const filas=personal.map((p,i)=>{
    const dias=diasMap[p.nombre]||{presentes:0,ausentes:0};
    const d=dias.presentes||0;
    const aux=p.salario<=2*SMMLV?AUX_T:0;
    const salProp=Math.round(p.salario*d/30);
    const auxProp=Math.round(aux*d/30);
    const he=heMap[p.nombre]||{horas:0,valor:0};
    const totalDev=salProp+auxProp+he.valor;
    const dedSalud=Math.round(salProp*0.04);
    const dedPens=Math.round(salProp*0.04);
    const neto=totalDev-dedSalud-dedPens;
    const bg=i%2===0?"#f8fafc":"#fff";
    return `<tr style="background:${bg}">
      <td style="font-size:12px"><strong>${p.nombre}</strong><br><span class="muted">${p.cargo}</span></td>
      <td style="text-align:center;color:var(--green);font-weight:600">${d}</td>
      <td style="text-align:center;color:var(--red)">${dias.ausentes||0}</td>
      <td style="text-align:right">$${salProp.toLocaleString("es-CO")}</td>
      <td style="text-align:right">${auxProp>0?"$"+auxProp.toLocaleString("es-CO"):"—"}</td>
      <td style="text-align:right;color:var(--blue)">${he.horas>0?he.horas.toFixed(1)+"h · $"+he.valor.toLocaleString("es-CO"):"—"}</td>
      <td style="text-align:right;font-weight:700">$${totalDev.toLocaleString("es-CO")}</td>
      <td style="text-align:right;color:var(--red)">-$${(dedSalud+dedPens).toLocaleString("es-CO")}</td>
      <td style="text-align:right;font-weight:700;color:var(--green)">$${neto.toLocaleString("es-CO")}</td>
    </tr>`;
  }).join("");

  const totPresentes=personal.reduce((s,p)=>s+(diasMap[p.nombre]?.presentes||0),0);
  const totNeto=personal.reduce((p2,p)=>{
    const d=diasMap[p.nombre]?.presentes||0;
    const aux=p.salario<=2*SMMLV?AUX_T:0;
    const salProp=Math.round(p.salario*d/30);
    const auxProp=Math.round(aux*d/30);
    const he=heMap[p.nombre]||{valor:0};
    const totalDev=salProp+auxProp+he.valor;
    const ded=Math.round(salProp*0.08);
    return p2+(totalDev-ded);
  },0);

  const alertaSinReg = sinRegistros ? '<div class="alert alert-warn">📌 Aún no hay registros de asistencia. La nómina se calculará automáticamente conforme la SST registre los días.</div>' : "";

  return `
  ${alertaSinReg}
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-label">Días registrados</div><div class="stat-val azul">${hist.length}</div></div>
    <div class="stat-box"><div class="stat-label">HE aprobadas</div><div class="stat-val">${heAprobadas.length} reg.</div></div>
    <div class="stat-box"><div class="stat-label">Neto total estimado</div><div class="stat-val verde" style="font-size:16px">$${totNeto.toLocaleString("es-CO")}</div></div>
  </div>
  <div class="card">
    <div class="card-title">💰 Liquidación de nómina — datos acumulados</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Trabajador</th><th>Días trab.</th><th>Días aus.</th>
          <th>Sal. prop.</th><th>Aux. transp.</th><th>Horas extras</th>
          <th>Total devengado</th><th>Deducciones (8%)</th><th>Neto a pagar</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="exportarNominaExcel()">📥 Descargar Excel nómina</button>
      <button class="btn" onclick="irTab('resumen')">📊 Ver resumen</button>
    </div>
  </div>
  <div class="muted mt8" style="font-size:11px">
    Salario proporcional = Salario base × días trabajados / 30 · Deducciones empleado: Salud 4% + Pensión 4% sobre salario proporcional · Aux. transporte 2026: $249.095 (aplica si salario ≤ 2 SMMLV)
  </div>`;
}

// EXPORTAR EXCEL DE NÓMINA

function exportarNominaExcel(){
  if(typeof XLSX === "undefined"){
    alert("La librería de Excel aún está cargando. Espere un momento e intente de nuevo.");
    return;
  }

  const todoPersonal = getPersonal(); // incluye retirados
  const hist         = getAsistenciaHist();
  const heAprobadas  = getHorasExtras().filter(h=>h.estado==="aprobado");
  const SMMLV = 1423500, AUX_T = 249095;
  const MES_NUM = new Date().getMonth()+1;
  const ANIO_NUM = new Date().getFullYear();
  const DIAS_MES = new Date(ANIO_NUM, MES_NUM, 0).getDate();

  // ── Calcular días presentes por trabajador desde historial ──
  const diasMap = {};
  todoPersonal.forEach(p=>{ diasMap[p.nombre]={presentes:0,ausentes:0}; });
  hist.forEach(reg=>{
    reg.filas.forEach(f=>{
      if(!diasMap[f.nombre]) return;
      if(f.estado==="Presente") diasMap[f.nombre].presentes++;
      else diasMap[f.nombre].ausentes++;
    });
  });

  // ── Calcular HE por trabajador y por día ──
  const heMap  = {}; // nombre → {horas, valor, diurnas, dominicales, porDia:{}}
  const heDias = {}; // nombre → {dia: horas}
  todoPersonal.forEach(p=>{
    heMap[p.nombre]  = {horas:0, valor:0, diurnas:0, dominicales:0};
    heDias[p.nombre] = {};
  });
  heAprobadas.forEach(reg=>{
    const fecha = reg.fecha; // "DD/MM/YYYY"
    const dia   = parseInt(fecha.split("/")[0]);
    const dow   = new Date(parseInt(fecha.split("/")[2]), parseInt(fecha.split("/")[1])-1, dia).getDay();
    reg.detalle.forEach(d=>{
      if(!heMap[d.nombre]) heMap[d.nombre]={horas:0,valor:0,diurnas:0,dominicales:0};
      if(!heDias[d.nombre]) heDias[d.nombre]={};
      heMap[d.nombre].horas += d.horas;
      heMap[d.nombre].valor += d.valor;
      if(dow===0) heMap[d.nombre].dominicales += d.horas;
      else        heMap[d.nombre].diurnas     += d.horas;
      heDias[d.nombre][dia] = (heDias[d.nombre][dia]||0) + d.horas;
    });
  });

  const wb = XLSX.utils.book_new();

  // ═══════════════════════════════════════════════════
  // HOJA 1: NÓMINA PRINCIPAL
  // ═══════════════════════════════════════════════════
  const nomData = [];
  // Encabezados
  nomData.push(["CONSTRUCTHOR S.A.S.","","","","","NÓMINA CONTRATO OBRA LABOR","","","","","","HABITAD"]);

  nomData.push(["DATOS DEL TRABAJADOR","","","","","DEVENGADO","","","","","","DEDUCCIONES","","NÓMINA DEDUCIBLE"]);
  nomData.push(["NOMBRE EMPLEADO","CARGO","C.C.","INICIO LABORES","RETIRO","SALARIO BÁSICO","DÍAS LIQ.","SALARIO DEVENGADO","AUXILIO TRANSP.","BONIFICACIÓN","TOTAL DEVENGADO","SALUD (4%)","PENSIÓN (4%)","NÓMINA DEDUCIBLE"]);

  todoPersonal.forEach(p=>{
    const d      = diasMap[p.nombre]?.presentes || 0;
    const sal    = p.salario;
    const aux    = sal <= 2*SMMLV ? AUX_T : 0;
    const salProp = Math.round(sal*d/30);

  const wsNom = XLSX.utils.aoa_to_sheet(nomData);

    todoPersonal.reduce((s,p)=>s+(heMap[p.nombre]?.valor||0),0),
    todoPersonal.reduce((s,p)=>{const d=diasMap[p.nombre]?.presentes||0,sal=p.salario,sp=Math.round(sal*d/30);return s+Math.round(sp*0.2466);},0),
    todoPersonal.reduce((s,p)=>{const d=diasMap[p.nombre]?.presentes||0,sal=p.salario,aux=sal<=2*SMMLV?AUX_T:0,sp=Math.round(sal*d/30),ap=Math.round(aux*d/30),td=sp+ap,ded=Math.round(sp*0.08),neto=td-ded,he=heMap[p.nombre]||{valor:0},base=sp,paraf=Math.round(base*0.2466);return s+(neto+he.valor+paraf);},0),
    "Total: "+todoPersonal.length
  ];
  rsData.push(rsTotRow);

  const wsRS = XLSX.utils.aoa_to_sheet(rsData);
  wsRS["!cols"] = [{wch:30},{wch:18},{wch:10},{wch:10},{wch:14},{wch:11},{wch:13},{wch:13},{wch:15},{wch:12}];
  wsRS["!merges"] = [{s:{r:0,c:0},e:{r:0,c:9}}];
  XLSX.utils.book_append_sheet(wb, wsRS, "Resumen");

  // ── DESCARGAR ──────────────────────────────────────
  const fecha = getFechaISO().replace(/\//g,"-");
  XLSX.writeFile(wb, "Nomina_SanAntonio_"+obtenerMesNombre()+"_"+ANIO_NUM+".xlsx");
}

function obtenerMesNombre(){
  const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[new Date().getMonth()];
}

function aplicarFormatoNomina(ws, nPersonal){
  // Formatos numéricos para columnas de valores
  const rango = nPersonal + 6;
  for(let r=6; r<=rango; r++){
    ["F","G","H","I","J","K","L","M","N"].forEach(col=>{
      const ref = col+r;
      if(ws[ref]) ws[ref].z = col==="G"?"0":'#,##0';
    });
  }
}

function aplicarFormatoHE(ws, nPersonal, diasMes){
  const rango = nPersonal + 3;
  for(let r=3; r<=rango; r++){
    for(let c=3; c<=2+diasMes; c++){
      const ref = XLSX.utils.encode_cell({r:r-1,c:c-1});
      if(ws[ref] && typeof ws[ref].v === "number") ws[ref].z = "0.#";
    }
    // Columnas de valor
    [2+diasMes+4, 2+diasMes+5, 2+diasMes+6].forEach(c=>{
      const ref = XLSX.utils.encode_cell({r:r-1,c:c-1});
      if(ws[ref]) ws[ref].z = '#,##0';
    });
  }
}

function iniciales(n){ return n.split(" ").slice(0,2).map(x=>x[0]).join("").toUpperCase(); }
function getFechaISO(){
  const h=new Date();
  return `${h.getDate().toString().padStart(2,"0")}/${(h.getMonth()+1).toString().padStart(2,"0")}/${h.getFullYear()}`;
}
function mostrarOk(titulo,sub,detalle){
  document.getElementById("okTitle").textContent=titulo;
  document.getElementById("okSub").textContent=sub;
  document.getElementById("okDetail").innerHTML=detalle;
  document.getElementById("overlayOk").classList.add("vis");
}
function cerrarOverlayOk(){
  document.getElementById("overlayOk").classList.remove("vis");
  irTab(tabActual);
}
